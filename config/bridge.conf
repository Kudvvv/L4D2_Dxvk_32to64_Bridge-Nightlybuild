# Experimental L4D2 windowed baseline using an upstream x64 DXVK release.
server.useVanillaDxvk = True
exposeRemixApi = False
client.targetProcess = left4dead2.exe
forceX64Server = True
client.forceWindowed = True
client.hookMessagePump = False
client.overrideCustomWinHooks = False
client.DirectInput.forward.mousePolicy = 0
client.DirectInput.forward.keyboardPolicy = 0
client.setExceptionHandler = True
useSharedHeap = False
useShadowMemoryForDynamicBuffers = True
clientChannelMemSize = 96MB
threadSafetyPolicy = 1
sendReadOnlyCalls = False
presentSemaphoreEnabled = False
disableTimeouts = False
logLevel = Debug
# Short diagnostic runs only: these logs can grow quickly.
logApiCalls = True
logServerCommands = True
