# 配置逐项说明、新增项及性能影响：docs/CONFIGURATION.md。
# 生效位置：游戏 bin/.l4d2bridge/bridge.conf；改动后重启游戏和 Host。
# 当前随包默认：窗口模式 + x86 Host + learned；升级保留已有配置。
# 下列配置值不等于所有键在省略时的源码缺省值。

# 使用普通 DXVK 后端（1.1 已有），不是 Remix 光追。
server.useVanillaDxvk = True
# 不暴露 Remix API。
exposeRemixApi = False
# 桥的目标游戏进程。
client.targetProcess = left4dead2.exe
# 选择统一运行目录；x86/x64 模式均保留 True，名称不代表实际 Host 位数。
forceX64Server = True
# 1.1 已有开关，本轮默认改为 True：32 位 Host；False：64 位 Host。
# 现有二进制省略此键仍回退 x64，因此保留显式选择。
client.testX86Server = True
# 将后端呈现参数强制为窗口模式；False 才允许游戏请求独占全屏。
client.forceWindowed = True
# 安装 Client 异常处理器；基础命令历史仍在正常运行中更新。
client.setExceptionHandler = True
# 新增，默认关闭：扩展异常发生后的历史/栈报告，不是逐帧扫描。
# False 仍保留基础异常报告；Host 有独立的处理器。
client.exceptionDiagnosticsDetailed = False
server.exceptionDiagnosticsDetailed = False

# 关闭上游资源共享堆，保持当前支持的 shadow + IPC / PageBlock 路径。
useSharedHeap = False
# 动态 VB/IB 使用 shadow；共享堆关闭时本就如此，不是新 buffer 回收功能。
useShadowMemoryForDynamicBuffers = True
# Client -> Host 通道容量；不是纹理缓存、显存或游戏内存上限。
clientChannelMemSize = 96MB
# 0：尊重游戏；1：强制线程安全（有锁成本）；2：强制非线程安全。
threadSafetyPolicy = 1
# 不额外向 Host 发送部分只读 Getter；True 用于诊断，会增加 IPC。
sendReadOnlyCalls = False
# 关闭额外 Present 帧数限流；不是关闭 VSync 或所有 IPC 等待。
presentSemaphoreEnabled = False
# False 表示保留超时机制；True 才是禁用相关普通超时。
disableTimeouts = False

# 1.1 已有默认优化，属于真实内存管理：可能有指纹、DB、ACK 和恢复等待成本。
# keep：保留内容；learned-aggressive：按历史回收；drop：新增实验，默认未选。
# 新增 LGC/AGC/FGC 是手动动作，不会自动定时执行；docs/PAGEBLOCK-DROP-GC.md。
client.pageBlockRetentionPolicy = learned-aggressive
# learned KEEP 指纹库；相对 Client DLL 所在 bin 解析，不保存纹理内容。
client.pageBlockRetentionDb = .l4d2bridge/resource-retention.db
# 映射缓存预算 MiB，0：解锁后不缓存，最大有效 1024；不是 backing/RAM 上限。
client.surfaceShadowCacheMB = 128

# 可选 ReShade：已测试 x64 Host + Vulkan ReShade 6.0.1。
# 需要时选择 x64 并合并 OVERLAY-INPUT.conf 中的配套设置。
# False 不创建 Host 呈现子窗口/线程，因此下项 True 不会单独启用输入。
server.presenterWindow = False
# 呈现子窗口启用后，允许对应的输入处理。
server.presenterInput = True
# Windows VK_HOME=36，默认 Home；不是游戏按键绑定。
server.presenterOverlayKey = 36
# 未绑定 ReShade 时的热键捕获兜底，默认关闭。
server.presenterHotkeyFallback = False
# 可选 Client 消息泵挂钩，与 Overlay 片段配套。
client.hookMessagePump = False
# 可选自定义窗口钩子兼容，与 Overlay 片段配套。
client.overrideCustomWinHooks = False
# 独占 DirectInput 向 Remix 窗口过程转发：0 从不，1 UI 不活动，2 UI 活动，3 总是。
# 0 不会禁用游戏键鼠，也不关闭独立 Presenter 输入。
client.DirectInput.forward.mousePolicy = 0
client.DirectInput.forward.keyboardPolicy = 0

# 以下诊断键在 1.1 已有，日常关闭；不关闭内存定期采样和真实 GC 日志。
# 可选资源锁历史、分类、模拟 LRU 与摘要，开启会增加记录/锁/同步日志成本。
client.pageBlockDiagnostics = False
# 上项开启时，增加逐资源销毁记录。
client.pageBlockDiagnosticsDetailed = False
# 保留参考副本比较 readback，开启会增加测试成本并阻止真实回收。
client.testReadbackRecovery = False
# 逐 Client API / Host command 日志，开启可能明显影响性能。
logApiCalls = False
logServerCommands = False
# 常规日志门槛；Info 不代表关闭独立 memory/retention/GC 日志。
logLevel = Info

# 新增可选键在普通配置中省略，缺省均为 False：
# client/server.apiWaitDiagnostics：API/IPC 计时、诊断线程和日志。
# client/server.colorDiagnostics：偏色状态/上传摘要、查询和异步日志。
# client/server.steamInputDiagnostics：输入状态观察（不是完整 Steam 输入修复）。
# 详细设置见 docs/CONFIGURATION.md；专用偏色安装脚本会主动开启 colorDiagnostics。
# 关闭可选诊断后，基础异常历史、VB/IB 计数、定期内存采样及 residency 管理仍运行。
