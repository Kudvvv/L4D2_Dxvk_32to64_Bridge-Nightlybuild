name: IPC wrap gameplay test build
on:
  push:
    branches: [codex/ipc-data-queue-correctness]
    paths: [patches/l4d2-bridge.patch, tests/data_ring_contract.cpp, tests/ipc_transport_cases.cpp, scripts/run_ipc_transport.py, .github/workflows/ipc-wrap-test.yml]
permissions:
  contents: read
jobs:
  build-and-test:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install build tools
        run: python -m pip install meson==1.3.2 ninja==1.11.1.1
      - name: Download pinned backend for build checks only
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force .deps | Out-Null
          curl.exe --fail --location --retry 3 https://github.com/doitsujin/dxvk/releases/download/v2.6.1/dxvk-2.6.1.tar.gz --output .deps/dxvk.tar.gz
          if ($LASTEXITCODE -ne 0) { throw 'DXVK download failed' }
          if ((Get-FileHash .deps/dxvk.tar.gz -Algorithm SHA256).Hash.ToLower() -ne '7ee0bef415910c943d3bda47d9d6821b9c8ca7a74f1e9f6151707d268cf3ce7f') { throw 'DXVK checksum mismatch' }
          tar -xzf .deps/dxvk.tar.gz -C .deps
          if ($LASTEXITCODE -ne 0) { throw 'DXVK extraction failed' }
      - name: Prepare sources
        run: python scripts/prepare_bridge.py
      - name: Check layouts and native x86 to x86 and x64 transport including wrap
        shell: powershell
        run: |
          ./scripts/test_data_ring_contract.ps1
          ./scripts/test_ipc_transport.ps1
      - name: Compile matched x86 Client and x86 and x64 Host
        shell: powershell
        run: ./scripts/build_bridge.ps1 -DxvkDll .deps/dxvk-2.6.1/x64/d3d9.dll -Dxvk32Dll .deps/dxvk-2.6.1/x32/d3d9.dll -PatchOnly
      - name: Check buffer history and ATI uploads
        shell: powershell
        run: |
          ./scripts/test_buffer_contract.ps1
          ./scripts/test_ati_texture_layout.ps1
      - name: Prepare minimal gameplay zip (no backend or configuration)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/gameplay-test | Out-Null
          Copy-Item dist/l4d2-bridge-patch/bin dist/gameplay-test/bin -Recurse
          Copy-Item dist/l4d2-bridge-patch/BUILD-INFO.json dist/gameplay-test/
          Copy-Item dist/l4d2-bridge-patch/SHA256.json dist/gameplay-test/
          Copy-Item docs/IPC-WRAP-GAMEPLAY-TEST.md dist/gameplay-test/INSTALL-zh.md
          Copy-Item LICENSE,THIRD_PARTY.md dist/gameplay-test/
          Copy-Item dist/l4d2-bridge-patch/licenses dist/gameplay-test/licenses -Recurse
          Compress-Archive -Path dist/gameplay-test/* -DestinationPath dist/LDB-PR6-ipc-wrap-test.zip
      - uses: actions/upload-artifact@v4
        with:
          name: LDB-PR6-ipc-wrap-test
          path: dist/LDB-PR6-ipc-wrap-test.zip
          if-no-files-found: error
