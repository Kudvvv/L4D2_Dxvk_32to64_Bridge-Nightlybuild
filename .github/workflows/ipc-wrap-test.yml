name: IPC wrap validation build
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-and-test:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install build tools
        run: python -m pip install meson==1.3.2 ninja==1.11.1.1
      - name: Prepare sources
        run: python scripts/prepare_bridge.py
      - name: Check layouts and native x86 to x86 and x64 transport including wrap
        shell: powershell
        run: |
          ./scripts/test_data_ring_contract.ps1
          ./scripts/test_ipc_transport.ps1
      - name: Compile matched x86 Client and x86 and x64 Host
        shell: powershell
        run: ./scripts/build_bridge.ps1
      - name: Check buffer history and ATI uploads
        shell: powershell
        run: |
          ./scripts/test_buffer_contract.ps1
          ./scripts/test_ati_texture_layout.ps1
      - name: Verify packaged GPLALL x86 backend
        shell: powershell
        run: ./scripts/test_x86_backend.ps1
      - name: Archive the validated full runtime package without publishing
        run: python scripts/archive_runtime.py dist/l4d2-bridge dist/ipc-wrap-full.zip
      - uses: actions/upload-artifact@v4
        with:
          name: ipc-wrap-full-validation
          path: dist/ipc-wrap-full.zip
          if-no-files-found: error
