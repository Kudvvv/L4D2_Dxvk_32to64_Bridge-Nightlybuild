# Upstream compatibility entry point; the default Nightly workflow owns publication.
name: Validate full upstream Bridge integration
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-build:
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install meson==1.3.2 ninja==1.11.1.1
      - name: Build the matched Client, both Hosts and optional plugin
        shell: powershell
        run: ./scripts/build_bridge.ps1
      - name: Test all imported upstream features
        shell: powershell
        run: ./scripts/test_upstream_features.ps1
      - name: Test Python contracts and package validation
        run: python -m unittest discover -s tests -p 'test_*.py'
      - uses: actions/upload-artifact@v4
        with:
          name: full-bridge-validation
          path: dist/l4d2-bridge/
          include-hidden-files: true
          if-no-files-found: error
