name: Build latest upstream Bridge
on:
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:
    inputs:
      upstream_commit:
        description: 'Optional full upstream commit SHA; empty tracks upstream default-branch HEAD'
        required: false
        type: string
permissions:
  contents: read
concurrency:
  group: upstream-release-build
  cancel-in-progress: false
jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.detect.outputs.matrix }}
      pending: ${{ steps.detect.outputs.pending }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - id: detect
        run: |
          python -m unittest discover -s tests -p "test_release*.py"
          python scripts/detect_release.py
        env:
          GH_TOKEN: ${{ github.token }}
          UPSTREAM_COMMIT: ${{ inputs.upstream_commit }}
  build:
    needs: detect
    if: needs.detect.outputs.pending == 'true'
    runs-on: windows-2022
    timeout-minutes: 90
    permissions:
      contents: read
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix: ${{ fromJSON(needs.detect.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install meson==1.3.2 ninja==1.11.1.1
      - name: Build patched x86 client and x64 Host
        shell: powershell
        run: ./scripts/build_bridge.ps1 -UpstreamCommit $env:UPSTREAM_COMMIT
        env:
          UPSTREAM_COMMIT: ${{ matrix.commit }}
      - name: Test diagnostics and shadow eviction
        shell: powershell
        run: ./scripts/test_diagnostics.ps1
      - name: Record provenance and archive
        shell: pwsh
        env:
          UPSTREAM_TAG: ${{ matrix.tag }}
          UPSTREAM_BRANCH: ${{ matrix.branch }}
          UPSTREAM_COMMIT: ${{ matrix.commit }}
          RECIPE_COMMIT: ${{ github.sha }}
          RELEASE_TITLE: ${{ matrix.title }}
          ARCHIVE_NAME: ${{ matrix.archive }}
          BUILD_KIND: ${{ matrix.kind }}
          COMMITS_AFTER_TAG: ${{ matrix.distance }}
        run: |
          $metadata = @{ upstream_tag = $env:UPSTREAM_TAG; upstream_branch = $env:UPSTREAM_BRANCH; build_kind = $env:BUILD_KIND; commits_after_tag = $env:COMMITS_AFTER_TAG; upstream_commit = $env:UPSTREAM_COMMIT; recipe_commit = $env:RECIPE_COMMIT; game_validation = 'Not performed; experimental build' }
          $metadata | ConvertTo-Json | Set-Content dist/l4d2-bridge/UPSTREAM.json -Encoding utf8
          $archive = $env:ARCHIVE_NAME
          python scripts/archive_release.py dist/l4d2-bridge $archive
          if ($LASTEXITCODE -ne 0) { throw 'Archive failed' }
          "$((Get-FileHash $archive -Algorithm SHA256).Hash.ToLower())  $archive" | Set-Content "$archive.sha256" -Encoding ascii
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.release_tag }}
          path: |
            l4d2-bridge-*.zip
            l4d2-bridge-*.zip.sha256
          if-no-files-found: error
  publish:
    needs: [detect, build]
    if: ${{ always() && needs.detect.outputs.pending == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.detect.outputs.matrix) }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.release_tag }}
          path: assets
      - name: Publish experimental release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ matrix.release_tag }}
          UPSTREAM_TAG: ${{ matrix.tag }}
          UPSTREAM_BRANCH: ${{ matrix.branch }}
          UPSTREAM_COMMIT: ${{ matrix.commit }}
          RECIPE_COMMIT: ${{ github.sha }}
          RELEASE_TITLE: ${{ matrix.title }}
          ARCHIVE_NAME: ${{ matrix.archive }}
          BUILD_KIND: ${{ matrix.kind }}
          COMMITS_AFTER_TAG: ${{ matrix.distance }}
        run: |
          printf 'L4D2 Bridge Nightly\n\nUpstream commit: %s\nBuild recipe: %s\n\n包含 x86 客户端与匹配的 x64 Host。DXVK 后端由 config/backend.json 独立固定。编译与诊断测试通过，尚未完成游戏实测。\n' "$UPSTREAM_COMMIT" "$RECIPE_COMMIT" > notes.md
          printf '\n### 上游依据\n\n- 上游项目：[NVIDIA dxvk-remix](https://github.com/NVIDIAGameWorks/dxvk-remix)\n- 来源分支：`%s`\n- 实际构建提交：[`%s`](https://github.com/NVIDIAGameWorks/dxvk-remix/commit/%s)\n- 本仓库构建配置：[`%s`](https://github.com/%s/commit/%s)\n\nNightly 日期采用上游提交日期（UTC）。\n' "$UPSTREAM_BRANCH" "$UPSTREAM_COMMIT" "$UPSTREAM_COMMIT" "$RECIPE_COMMIT" "$GH_REPO" "$RECIPE_COMMIT" >> notes.md
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --target "$RECIPE_COMMIT" --title "$RELEASE_TITLE" --notes-file notes.md --prerelease --draft
          fi
          gh release upload "$RELEASE_TAG" assets/* --clobber
          gh release edit "$RELEASE_TAG" --draft=false --prerelease --title "$RELEASE_TITLE" --notes-file notes.md


