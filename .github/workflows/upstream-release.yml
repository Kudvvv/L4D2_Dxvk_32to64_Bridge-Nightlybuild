name: Build latest upstream Bridge
on:
  push:
    branches: [main]
    paths:
      - 'patches/**'
      - 'config/**'
      - 'scripts/**'
      - 'tests/**'
      - 'licenses/**'
      - '.github/workflows/**'
      - 'VERSION'
      - 'LICENSE'
      - 'THIRD_PARTY.md'
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:
    inputs:
      force_rebuild:
        description: "强制重建：创建独立版本，保留已有附件"
        required: false
        default: false
        type: boolean
      upstream_commit:
        description: 'Optional full upstream commit SHA; empty tracks upstream default-branch HEAD'
        required: false
        type: string
      validation_only:
        description: 'Build, test and benchmark without publishing a release'
        required: false
        default: false
        type: boolean
      thinflex_test:
        description: 'Publish a labeled ThinFlex test release with a separate optional engine patch tool'
        required: false
        default: false
        type: boolean
permissions:
  contents: read
concurrency:
  group: upstream-release-build
  cancel-in-progress: false
jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.detect.outputs.matrix }}
      pending: ${{ steps.detect.outputs.pending }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - id: detect
        run: |
          python -m unittest discover -s tests -p "test_*.py"
          python scripts/detect_release.py
        env:
          GH_TOKEN: ${{ github.token }}
          UPSTREAM_COMMIT: ${{ inputs.upstream_commit }}
          FORCE_REBUILD: ${{ github.event_name == 'workflow_dispatch' && inputs.force_rebuild }}
          THINFLEX_TEST: ${{ github.event_name == 'workflow_dispatch' && inputs.thinflex_test }}
  build:
    needs: detect
    if: needs.detect.outputs.pending == 'true'
    runs-on: windows-2022
    timeout-minutes: 90
    permissions:
      contents: read
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix: ${{ fromJSON(needs.detect.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install meson==1.3.2 ninja==1.11.1.1
      - name: Build patched x86 client and x64 Host
        shell: powershell
        run: ./scripts/build_bridge.ps1 -UpstreamCommit $env:UPSTREAM_COMMIT
        env:
          UPSTREAM_COMMIT: ${{ matrix.commit }}
      - name: Test diagnostics and shadow eviction
        shell: powershell
        run: ./scripts/test_diagnostics.ps1
      - name: Test resource creation cleanup and buffer lock bounds
        shell: powershell
        run: ./scripts/test_resource_lifecycle.ps1
      - name: Test Host swapchain query and Reset temporary references
        shell: powershell
        run: ./scripts/test_device_reset_lifetime.ps1
      - name: Test ATI texture transfer bounds (x86 and x64)
        shell: powershell
        run: ./scripts/test_ati_texture_layout.ps1
      - name: Test command queue wakeups and cross-process transport
        shell: powershell
        run: ./scripts/test_command_queue.ps1
      - name: Benchmark command queue ordering
        if: ${{ inputs.validation_only }}
        shell: powershell
        run: ./scripts/test_command_queue.ps1 -Benchmark
      - name: Test actual volume lock and upload code (x86 and x64)
        shell: powershell
        run: ./scripts/test_volume_texture.ps1
      - name: Benchmark volume upload copying
        if: ${{ inputs.validation_only }}
        shell: powershell
        run: ./scripts/test_volume_texture.ps1 -Benchmark
      - name: Save native validation results
        if: ${{ always() && inputs.validation_only }}
        uses: actions/upload-artifact@v4
        with:
          name: validation-${{ matrix.release_tag }}
          path: |
            .deps/queue-test/*.json
            .deps/queue-test/*.csv
            .deps/queue-test/*.exe
            .deps/volume-test/*.json
            .deps/volume-test/*.csv
            .deps/volume-test/*.exe
          include-hidden-files: true
          if-no-files-found: warn
      - name: Build optional ThinFlex test tool
        if: inputs.thinflex_test
        shell: pwsh
        env:
          THINFLEX_ARCHIVE_NAME: ${{ matrix.thinflex_archive }}
          RECIPE_COMMIT: ${{ github.sha }}
        run: |
          python -m pip install pyinstaller==6.16.0
          if ($LASTEXITCODE -ne 0) { throw 'PyInstaller installation failed' }
          python -m PyInstaller --onefile --clean --noconfirm --name ThinFlexPatch --distpath dist/thinflex-tool --workpath .deps/thinflex-freeze --specpath .deps/thinflex-freeze scripts/patch_studiorender_flex.py
          if ($LASTEXITCODE -ne 0) { throw 'ThinFlex tool build failed' }
          & ./dist/thinflex-tool/ThinFlexPatch.exe --help
          if ($LASTEXITCODE -ne 0) { throw 'Frozen tool smoke test failed' }
          Set-Content .deps/thinflex-freeze/unsupported.dll 'unsupported input' -Encoding ascii
          & ./dist/thinflex-tool/ThinFlexPatch.exe create .deps/thinflex-freeze/unsupported.dll .deps/thinflex-freeze/rejected.dll --experimental-engine-patch
          if ($LASTEXITCODE -ne 1 -or (Test-Path .deps/thinflex-freeze/rejected.dll) -or (Test-Path .deps/thinflex-freeze/rejected.dll.manifest.json)) { throw 'Frozen tool failed to reject unsupported DLL safely' }
          python -c "import importlib.metadata,pathlib,shutil,sys; d=importlib.metadata.distribution('pyinstaller'); p=next(d.locate_file(f) for f in d.files if f.name == 'COPYING.txt'); shutil.copyfile(p,'.deps/thinflex-freeze/PyInstaller-COPYING.txt'); shutil.copyfile(pathlib.Path(sys.base_prefix)/'LICENSE.txt','.deps/thinflex-freeze/Python-LICENSE.txt')"
          if ($LASTEXITCODE -ne 0) { throw 'Missing frozen-tool license notices' }
          python scripts/package_thinflex_test.py --exe dist/thinflex-tool/ThinFlexPatch.exe --output $env:THINFLEX_ARCHIVE_NAME --version (Get-Content VERSION -Raw).Trim() --recipe-commit $env:RECIPE_COMMIT --run-id $env:GITHUB_RUN_ID --python-license .deps/thinflex-freeze/Python-LICENSE.txt --pyinstaller-license .deps/thinflex-freeze/PyInstaller-COPYING.txt
          if ($LASTEXITCODE -ne 0) { throw 'ThinFlex test archive failed' }
      - name: Record provenance and archive
        shell: pwsh
        env:
          UPSTREAM_TAG: ${{ matrix.tag }}
          UPSTREAM_BRANCH: ${{ matrix.branch }}
          UPSTREAM_COMMIT: ${{ matrix.commit }}
          RECIPE_COMMIT: ${{ github.sha }}
          RELEASE_TITLE: ${{ matrix.title }}
          ARCHIVE_NAME: ${{ matrix.archive }}
          UPDATE_ARCHIVE_NAME: ${{ matrix.update_archive }}
          RECIPE_DIGEST: ${{ matrix.recipe_digest }}
          RELEASE_TAG: ${{ matrix.release_tag }}
          BUILD_KIND: ${{ matrix.kind }}
          COMMITS_AFTER_TAG: ${{ matrix.distance }}
          THINFLEX_TEST: ${{ inputs.thinflex_test }}
        run: |
          $metadata = @{ release_tag = $env:RELEASE_TAG; upstream_branch = $env:UPSTREAM_BRANCH; upstream_commit = $env:UPSTREAM_COMMIT; recipe_commit = $env:RECIPE_COMMIT; recipe_digest = $env:RECIPE_DIGEST; build_run = $env:GITHUB_RUN_ID; build_attempt = $env:GITHUB_RUN_ATTEMPT; game_validation = 'Not performed; experimental build' }
          if ($env:THINFLEX_TEST -eq 'true') { $metadata.release_channel = 'thinflex-test'; $metadata.thinflex_engine_patch_applied = $false }
          $metadata | ConvertTo-Json | Set-Content dist/l4d2-bridge/UPSTREAM.json -Encoding utf8
          foreach ($archive in @($env:ARCHIVE_NAME, $env:UPDATE_ARCHIVE_NAME)) {
            if ($archive -eq $env:UPDATE_ARCHIVE_NAME) {
              python scripts/archive_runtime.py dist/l4d2-bridge $archive --update
            } else {
              python scripts/archive_runtime.py dist/l4d2-bridge $archive
            }
            if ($LASTEXITCODE -ne 0) { throw 'Archive failed' }
            "$((Get-FileHash $archive -Algorithm SHA256).Hash.ToLower())  $archive" | Set-Content "$archive.sha256" -Encoding ascii
          }
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.release_tag }}
          path: |
            l4d2-bridge-*.zip
            l4d2-bridge-*.zip.sha256
          if-no-files-found: error
  publish:
    needs: [detect, build]
    if: ${{ needs.detect.outputs.pending == 'true' && needs.build.result == 'success' && !inputs.validation_only }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.detect.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.release_tag }}
          path: assets
      - name: Publish experimental release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ matrix.release_tag }}
          UPSTREAM_TAG: ${{ matrix.tag }}
          UPSTREAM_BRANCH: ${{ matrix.branch }}
          UPSTREAM_COMMIT: ${{ matrix.commit }}
          RECIPE_COMMIT: ${{ github.sha }}
          RECIPE_DIGEST: ${{ matrix.recipe_digest }}
          RELEASE_TITLE: ${{ matrix.title }}
          ARCHIVE_NAME: ${{ matrix.archive }}
          UPDATE_ARCHIVE_NAME: ${{ matrix.update_archive }}
          THINFLEX_ARCHIVE_NAME: ${{ matrix.thinflex_archive }}
          THINFLEX_TEST: ${{ inputs.thinflex_test }}
          BUILD_KIND: ${{ matrix.kind }}
          COMMITS_AFTER_TAG: ${{ matrix.distance }}
        run: python scripts/publish_release.py
