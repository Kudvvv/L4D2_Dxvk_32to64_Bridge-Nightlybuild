name: Build latest upstream Bridge
on:
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:
    inputs:
      upstream_commit:
        description: 'Optional full upstream commit SHA; empty tracks upstream default-branch HEAD'
        required: false
        type: string
permissions:
  contents: read
concurrency:
  group: upstream-release-build
  cancel-in-progress: false
jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.detect.outputs.matrix }}
      pending: ${{ steps.detect.outputs.pending }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - id: detect
        run: |
          python -m unittest discover -s tests -p test_release_detection.py
          python scripts/detect_release.py
        env:
          GH_TOKEN: ${{ github.token }}
          UPSTREAM_COMMIT: ${{ inputs.upstream_commit }}
  build:
    needs: detect
    if: needs.detect.outputs.pending == 'true'
    runs-on: windows-2022
    timeout-minutes: 90
    permissions:
      contents: read
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix: ${{ fromJSON(needs.detect.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install meson==1.3.2 ninja==1.11.1.1
      - name: Build patched x86 client and x64 Host
        shell: powershell
        run: ./scripts/build_bridge.ps1 -UpstreamCommit $env:UPSTREAM_COMMIT
        env:
          UPSTREAM_COMMIT: ${{ matrix.commit }}
      - name: Test diagnostics and shadow eviction
        shell: powershell
        run: ./scripts/test_diagnostics.ps1
      - name: Record provenance and archive
        shell: pwsh
        env:
          UPSTREAM_TAG: ${{ matrix.tag }}
          UPSTREAM_BRANCH: ${{ matrix.branch }}
          UPSTREAM_COMMIT: ${{ matrix.commit }}
          RECIPE_COMMIT: ${{ github.sha }}
        run: |
          $metadata = @{ upstream_tag = $env:UPSTREAM_TAG; upstream_branch = $env:UPSTREAM_BRANCH; upstream_commit = $env:UPSTREAM_COMMIT; recipe_commit = $env:RECIPE_COMMIT; game_validation = 'Not performed; experimental build' }
          $metadata | ConvertTo-Json | Set-Content dist/l4d2-bridge/UPSTREAM.json -Encoding utf8
          $archive = "bridge-$($env:UPSTREAM_TAG).zip"
          python scripts/archive_release.py dist/l4d2-bridge $archive
          if ($LASTEXITCODE -ne 0) { throw 'Archive failed' }
          "$((Get-FileHash $archive -Algorithm SHA256).Hash.ToLower())  $archive" | Set-Content "$archive.sha256" -Encoding ascii
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.release_tag }}
          path: |
            bridge-*.zip
            bridge-*.zip.sha256
          if-no-files-found: error
  publish:
    needs: [detect, build]
    if: ${{ always() && needs.detect.outputs.pending == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.detect.outputs.matrix) }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.release_tag }}
          path: assets
      - name: Publish experimental release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ matrix.release_tag }}
          UPSTREAM_TAG: ${{ matrix.tag }}
          UPSTREAM_BRANCH: ${{ matrix.branch }}
          UPSTREAM_COMMIT: ${{ matrix.commit }}
          RECIPE_COMMIT: ${{ github.sha }}
        run: |
          printf 'Experimental L4D2 Bridge build.\n\nUpstream source: %s\nUpstream commit: %s\nBuild recipe: %s\n\nBoth x86 client and matching x64 Host are included. The DXVK backend is independently pinned by config/backend.json. Compilation and diagnostic tests passed; L4D2 gameplay compatibility has not been verified. Back up your installation before testing.\n' "$UPSTREAM_TAG" "$UPSTREAM_COMMIT" "$RECIPE_COMMIT" > notes.md
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --target "$RECIPE_COMMIT" --title "Bridge from $UPSTREAM_TAG" --notes-file notes.md --prerelease --draft
          fi
          gh release upload "$RELEASE_TAG" assets/* --clobber
          gh release edit "$RELEASE_TAG" --draft=false --prerelease --notes-file notes.md


