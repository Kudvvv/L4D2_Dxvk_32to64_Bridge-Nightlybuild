# Multi-package publication was replaced by the protected single-package pipeline.
name: Validate release packaging
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate full-package contracts and retained upstream packaging helpers
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Show the release entry point
        run: echo 'Use Build latest upstream Bridge with force_rebuild to publish one full ZIP and its SHA-256.'
