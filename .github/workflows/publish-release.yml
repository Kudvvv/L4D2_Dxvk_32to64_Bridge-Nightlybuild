name: Publish tested release artifacts
on:
  workflow_dispatch:
    inputs:
      build_run_id:
        description: Successful build run containing versioned release artifacts
        required: true
      version:
        description: Release version without the v prefix
        required: true
      l4n_build_run_id:
        description: Prior successful run with unchanged L4N source/ABI (empty uses this build's separate plugin artifact)
        required: false
        default: ''
permissions:
  actions: read
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      BUILD_RUN_ID: ${{ inputs.build_run_id }}
      RELEASE_VERSION: ${{ inputs.version }}
      L4N_BUILD_RUN_ID: ${{ inputs.l4n_build_run_id }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify tested packages, optional plugin provenance and release draft before publishing
        run: python scripts/publish_release.py
