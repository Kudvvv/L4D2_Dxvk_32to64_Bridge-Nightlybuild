name: IPC data queue correctness
on:
  push:
    branches: [codex/ipc-data-queue-correctness]
permissions:
  contents: read
jobs:
  baseline:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Prepare pinned v1.2.1 production sources
        run: python scripts/prepare_bridge.py
      - name: Reproduce old transport failures on x86 and x64
        shell: powershell
        run: ./scripts/test_ipc_baseline.ps1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ipc-baseline-evidence
          path: .deps/ipc-baseline/
          if-no-files-found: error
