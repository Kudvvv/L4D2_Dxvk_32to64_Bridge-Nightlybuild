name: Build optional DXVK memory fix
on:
  workflow_dispatch:
  push:
    branches: [codex/l4d2-demo, main]
    paths:
      - '.github/workflows/build-dxvk-experiment.yml'
      - 'experiments/dxvk-memory/**'
      - 'patches/dxvk-memory-experiment.patch'
      - 'docs/DXVK-MEMORY-EXPERIMENT.md'
      - 'config/dxvk-memory-*.conf'
      - 'VERSION'
      - 'CHANGELOG.md'
      - 'THIRD_PARTY.md'
      - 'licenses/**'
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Read project version
        run: echo "L4D2_PROJECT_VERSION=$(cat VERSION)" >> "$GITHUB_ENV"
      - name: Install cross compiler and shader tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y g++-mingw-w64-x86-64-posix glslang-tools ninja-build
          python3 -m venv .tools
          .tools/bin/pip install meson==1.3.2 pefile==2024.8.26
          echo "$PWD/.tools/bin" >> "$GITHUB_PATH"
      - name: Test allocator tracking and chunk policy
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -fsanitize=address,undefined -g experiments/dxvk-memory/test_tracking.cpp -o /tmp/test-tracking
          /tmp/test-tracking
      - name: Prepare pinned standard DXVK source
        run: |
          git clone --branch v2.6.1 --depth 1 --recurse-submodules --shallow-submodules https://github.com/doitsujin/dxvk.git .deps/dxvk
          python experiments/dxvk-memory/prepare.py --source .deps/dxvk
          sed -i "s/x86_64-w64-mingw32-gcc'/x86_64-w64-mingw32-gcc-posix'/; s/x86_64-w64-mingw32-g++'/x86_64-w64-mingw32-g++-posix'/" .deps/dxvk/build-win64.txt
      - name: Build Windows x64 D3D9 backend
        run: |
          meson setup .deps/dxvk/build .deps/dxvk --cross-file .deps/dxvk/build-win64.txt --buildtype release -Denable_dxgi=false -Denable_d3d8=false -Denable_d3d10=false -Denable_d3d11=false
          ninja -C .deps/dxvk/build -j 2
      - name: Validate and package optional memory fix
        run: python experiments/dxvk-memory/package.py --source .deps/dxvk --dll .deps/dxvk/build/src/d3d9/d3d9.dll --output dist/l4d2-dxvk-memory-experiment
      - uses: actions/upload-artifact@v4
        with:
          name: l4d2-bridge-memory-update-v${{ env.L4D2_PROJECT_VERSION }}
          path: dist/l4d2-dxvk-memory-experiment/
          include-hidden-files: true
          if-no-files-found: error
